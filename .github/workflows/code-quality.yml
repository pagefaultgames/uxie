# Workflow to perform code quality checks on each commit/PR to main
name: Code Quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "main"
  push:
    branches:
      - "main"
  merge_group:
    types: [checks_requested]
  # allow manually triggering on branches
  workflow_dispatch:

permissions:
  contents: read

env:
  go_version: 1.25.5

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

