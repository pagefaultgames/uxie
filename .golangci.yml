# .golangci.yml
version: "2"
run:
  timeout: 3m
  tests: true

formatters:
  enable:
    - gofumpt
    - golines
  settings:
    gofumpt:
      # TODO: Enable once -extra being split up is backported to golangci-lint to disable naked return editing
      extra-rules: false
    golines:
      max-len: 100
      chain-split-dots: true
      tab-len: 4

linters:
  default: standard
  enable:
    - staticcheck
    - whitespace
    - nakedret
  settings:
    nakedret:
      max-func-lines: 50
    errcheck:
      # Catch unchecked errors, but allow _ in tests.
      exclude-functions:
        - (*testing.T).Error
        - (*testing.T).Fatal
        - (*testing.T).Fatalf
        - (*testing.T).Log
        - (*testing.T).Logf
        - (*testing.T).Errorf
      check-type-assertions: true
