# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Install and initialize Lefthook.
    cmds:
      - task: lefthook-install
      - task: lefthook-setup
    method: none

  lefthook-install:
    desc: Install Lefthook if not already installed.
    cmd: |
      if command -v lefthook >/dev/null 2>&1; then
        echo "Lefthook already installed."
      else
        echo "Lefthook not found; installing via go install..."
        go install github.com/evilmartians/lefthook/v2@latest
      fi
    method: none
    internal: true

  lefthook-setup:
    desc: Set up Lefthook git hooks.
    cmd: lefthook install
    method: none
    internal: true

  lint:
    desc: Run golangci-lint code quality checks.
    aliases: [fmt]
    preconditions:
      - sh: command -v golangci-lint
        msg: Golangci-lint executable not found in PATH!
    cmds:
      - cmd: |
          if [ -z "$CI" ]; then
            golangci-lint fmt
          fi
      - cmd: golangci-lint run --fix

    method: none

  run:
    desc: Run the Uxie backend binary.
    cmd: go run .
    method: none

  tests:
    desc: Run all tests with gotestsum and generate reports.
    cmds:
      - cmd: >
          go tool gotest.tools/gotestsum 
          --format=testname
          --format-hide-empty-pkg
          --format-icons=text
          --junitfile=./tmp/test-results/go-test-report.xml
          --junitfile-hide-empty-pkg
          --junitfile-testcase-classname=short
          --junitfile-testsuite-name=short
    method: none
