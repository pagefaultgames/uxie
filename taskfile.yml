# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Install and initialize Lefthook.
    cmds:
      - task: lefthook-install
      - task: lefthook-setup
      - cmd: command -v gcc || echo "GCC not found (required for go-sqlite3); please install"
    method: none

  lefthook-install:
    desc: Install Lefthook if not already installed.
    cmd: |
      if command -v lefthook >/dev/null 2>&1; then
        echo "Lefthook already installed."
      else
        echo "Lefthook not found; installing via go install..."
        go install github.com/evilmartians/lefthook/v2@latest
      fi
    method: none
    internal: true

  lefthook-setup:
    desc: Set up Lefthook git hooks.
    cmd: lefthook install
    method: none
    internal: true

  lint:
    desc: Run golangci-lint code quality checks.
    aliases: [fmt]
    preconditions:
      - sh: command -v golangci-lint
        msg: Golangci-lint executable not found in PATH!
    cmds:
      - cmd: |
          if [ -z "$CI" ]; then
            golangci-lint fmt
          fi
      - cmd: golangci-lint run --fix

    method: none

  air:
    desc: Setup hot reload with air
    cmd: go tool github.com/air-verse/air
    method: none
  build:
    desc: Build the Oranguru backend binary.
    cmd: go build -o tmp/oranguru .
    method: none

  test:
    desc: Run backend tests with environment-aware defaults.
    cmd: source ./tasks/test.sh {{.CLI_ARGS}}
    method: none
